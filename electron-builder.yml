appId: io.github.imguru18695.xviewer
productName: XViewer
icon: build/page-wing.png
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.prettierignore,.prettierrc.yaml,.editorconfig,dev-app-update.yml,README.md,SPEC.md}'
  - '!{.env,.env.*,.dev.vars,.dev.vars.example,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!scripts/**'
  - '!native/**'
  - 'native/build/Release/*.node'
  - '!resources/**'
  - '!.smoke/**'
  - '!tests/**'
  - '!docs/**'
  - '!.github/**'
  - '!.audit-local.json'
  - '!package-lock.json'
asarUnpack:
  - native/build/Release/*.node
extraResources:
  - from: build/page-wing.png
    to: page-wing.png
  - from: resources/ocr
    to: ocr
  - from: resources/pdf
    to: pdf
fileAssociations:
  - ext: pdf
    name: PDF Document
    description: PDF document
    mimeType: application/pdf
    role: Editor
  - ext: pdfx
    name: PDFX Collection
    description: PDFX multi-document PDF collection
    mimeType: application/x-pdfx
    role: Viewer
mac:
  icon: build/page-wing.icns
  category: public.app-category.productivity
win:
  icon: build/page-wing.ico
  target:
    - target: nsis
      arch: [x64]
  executableName: XViewer
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  maintainer: imguru18695
  synopsis: One file. Many documents. Still a PDF.
  description: An open, backwards-compatible PDF extension that bundles many documents into one valid PDF, plus a minimal desktop viewer that splits it back into the original files.
deb:
  afterInstall: &after-install build/linux/after-install.tpl
rpm:
  afterInstall: *after-install
flatpak:
  runtimeVersion: '23.08'
  baseVersion: '23.08'
nsis:
  installerIcon: build/page-wing.ico
  uninstallerIcon: build/page-wing.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
